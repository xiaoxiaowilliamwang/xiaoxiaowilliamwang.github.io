/* V3 — editorial single-column projects and awards, English-first personal website */
.projects{background:#f0f7fd}
.projects .section-header{margin-bottom:42px}
.project-grid{display:flex;flex-direction:column;gap:0;border-top:1px solid #d2e3f2}
.project-card{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:28px;padding:30px 0;background:transparent;border:0;border-bottom:1px solid #d2e3f2;border-radius:0;overflow:visible;transition:none}
.project-card:hover{transform:none;box-shadow:none}
.project-index{font-size:14px;letter-spacing:-.02em;font-weight:850;color:#467fa9;align-self:start;padding-top:12px;white-space:nowrap}
.project-index span{font-size:10px;font-weight:700;color:#acc6d9}
.project-graphic{height:218px;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px #244b6c0d}
.project-graphic>.art-bg{border-radius:12px}
.project-body{padding:1px 0;min-width:0;gap:0}
.project-category{font-size:10px;font-weight:800;letter-spacing:.13em;color:#6297bb}
.project-title-row{align-items:center;justify-content:flex-start;gap:18px;flex-wrap:wrap;margin:2px 0 6px}
.project-title-row h3{font-size:clamp(23px,2.5vw,34px);font-weight:800;letter-spacing:-.05em;margin:10px 0 5px;color:#172f48}
.project-role{padding:5px 9px;background:#e1f1fc;color:#3679a8;border-radius:4px;font-size:10px;white-space:nowrap;font-weight:800}
.project-body>p.project-description{font-size:13px;line-height:1.82;color:#50677e;min-height:0;max-width:750px;margin:7px 0 8px}
.project-body>p.project-note{font-size:11.5px;line-height:1.7;color:#7d94a7;min-height:0;max-width:750px;margin:0 0 7px}
.project-bottom{margin-top:7px;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.project-actions{display:flex;align-items:center;gap:20px;flex:none}
.project-actions .simple-link{font-size:11px;font-weight:800;white-space:nowrap}
.project-live{color:#2579b5}
.project-tags{gap:5px}
.project-tags span{font-size:9.5px;padding:5px 8px}
/* One awards section per row. A darker/heavier event name establishes hierarchy. */
.awards-grid{display:flex;flex-direction:column;gap:0;border-top:1px solid #d6e4ef}
.award-group,.award-group:last-child{display:grid;grid-template-columns:225px minmax(0,1fr);gap:20px;max-width:none;grid-column:auto;border-top:0;border-bottom:1px solid #d6e4ef;margin:0;padding:22px 0 27px}
.award-group-title{align-items:flex-start;padding:10px 10px 0 0;gap:12px}
.award-group-title h3{font-size:16px;font-weight:800;color:#29465f;line-height:1.4}
.award-symbol{flex:none}
.award-count{display:none}
.award-row{grid-template-columns:75px minmax(0,1fr) minmax(104px,auto);gap:20px;align-items:center;padding:18px 12px 18px 2px;border-bottom:1px solid #e3edf5}
.award-row:last-child{border-bottom:0}
.award-year{font-size:12px;font-weight:800;color:#7196b5;padding-top:0}
.award-name{font-size:15.5px;font-weight:800;line-height:1.5;color:#192f47;letter-spacing:-.018em}
.award-result{justify-self:end;font-size:11px;padding:8px 12px;background:#d9ecfc;color:#205d8b;font-weight:850;border:1px solid #c3e1f7;border-radius:5px}
.award-arrow{justify-self:end;color:#acc4d8}
@media(max-width:1130px){
 .project-card{grid-template-columns:36px minmax(0,1fr);gap:19px}
 .project-graphic{height:196px}
 .project-title-row h3{font-size:25px}
 .project-bottom{align-items:flex-start;flex-direction:column}
 .award-group,.award-group:last-child{grid-template-columns:190px minmax(0,1fr)}
}
@media(max-width:760px){
 .projects .section-header{margin-bottom:27px}
 .project-card{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:27px 0}
 .project-index{align-self:flex-start;padding:0}
 .project-graphic{height:220px;max-width:none}
 .project-body{padding:2px 0 0}
 .project-title-row h3{font-size:27px}
 .project-body>p.project-description{font-size:13px;margin-top:4px}
 .project-bottom{flex-direction:column;align-items:stretch;gap:14px}
 .project-actions{flex-wrap:wrap;gap:20px}
 .award-group,.award-group:last-child{display:block;padding:25px 0 20px}

 .award-row{grid-template-columns:57px minmax(0,1fr);gap:6px 10px;align-items:start;padding:17px 0}
 .award-year{padding-top:3px;font-size:11px}
 .award-name{font-size:14.5px}
 .award-result,.award-arrow{grid-column:2;justify-self:start;margin-top:2px}
 .award-result{font-size:10px;padding:5px 10px}
}
/* Stretch each award category across the complete content width. */
.awards-grid{align-items:stretch}
@media(max-width:700px){
  .hero h1{white-space:normal;font-size:clamp(42px,9.5vw,66px);line-height:1.12}
}

/* V4: Chronological awards with full competition names, category tags,
   and a plain inline award result (no blue medal/prize boxes). */
.competitions .section-header.compact{margin-bottom:30px}
.awards-grid.timeline-list{display:flex;flex-direction:column;gap:0;border-top:1px solid #d6e4ef;align-items:stretch}
.timeline-list .award-row{
 display:grid;grid-template-columns:98px minmax(0,1fr);gap:22px;
 width:100%;padding:21px 4px 21px 2px;border-bottom:1px solid #e1eaf2;
 align-items:baseline;
}
.timeline-list .award-row:hover{background:#f6fbff}
.timeline-list .award-year{font-size:13px;font-weight:800;color:#7292ac;padding-top:3px;font-variant-numeric:tabular-nums}
.timeline-list .award-details{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 11px;min-width:0}
.timeline-list .award-name{font-size:16px;line-height:1.65;font-weight:850;letter-spacing:-.02em;color:#142b45}
.timeline-list .award-category{
 display:inline-flex;align-items:center;background:#e9f4fb;color:#477a9c;
 font-size:10px;font-weight:750;line-height:1.5;padding:2px 7px;border-radius:4px;
 white-space:nowrap;vertical-align:middle;
}
.timeline-list .award-result{
 display:inline;justify-self:auto;background:transparent!important;border:0!important;
 border-radius:0!important;padding:0!important;margin:0!important;
 color:#4b6277;font-size:13px;font-weight:650;line-height:1.65;
 white-space:normal;
}
.timeline-list .award-dash{color:#9aaebb;margin-right:2px}
.timeline-list .award-row[data-category="participation"] .award-result{font-weight:500;color:#8496a8}
.awards-footnote{line-height:1.8;max-width:850px}
@media(max-width:760px){
 .timeline-list .award-row{grid-template-columns:57px minmax(0,1fr);gap:10px;padding:18px 0}
 .timeline-list .award-year{font-size:11px;padding-top:5px}
 .timeline-list .award-name{font-size:14px;line-height:1.6}
 .timeline-list .award-details{gap:4px 8px}
 .timeline-list .award-result{font-size:12px}
 .timeline-list .award-category{font-size:9px}
}
@media(max-width:390px){
 .timeline-list .award-row{grid-template-columns:46px minmax(0,1fr);gap:7px}
 .timeline-list .award-name{font-size:13px}
}

/* V5: Make the actual distinctions pop, without bringing back award boxes. */
.timeline-list .award-result.award-distinction {
  color:#143a5a; font-size:15px; font-weight:900; letter-spacing:-.015em;
}
.timeline-list .award-result.award-distinction strong{font-weight:900;}
.timeline-list .award-emoji{display:inline-block;font-size:18px;line-height:1;vertical-align:-2px;margin-left:2px;}
.timeline-list .award-result.award-participated{color:#8799a9;font-size:12px;font-weight:500;}
.timeline-list .award-result.award-participated strong{font-weight:500;}
@media(max-width:760px){
 .timeline-list .award-result.award-distinction{font-size:13px;}
 .timeline-list .award-emoji{font-size:16px;}
 .timeline-list .award-result.award-participated{font-size:11px;}
}

.blog-feature h3{font-size:clamp(25px,2.6vw,34px);line-height:1.25;letter-spacing:-.04em;color:#1a3553;margin:0 0 11px;font-weight:750}

.blog-feature-content>p{color:#72869c;font-size:13px;line-height:1.9;margin:0 0 27px}

      case 'robot':return `<div class="art-bg art-robot"><div class="visual-grid"></div><div class="robot-top">ROBOCUP / SRC</div><svg class="robot-sketch" viewBox="0 0 320 220" fill="none" aria-hidden="true"><g stroke="#a4d5ff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M100 168h117l19 23H82l18-23Z"/><path d="M118 168v-45h83v45M130 123V96h58v27M149 96V65h20v31M159 65V40M148 40h22"/><path d="m119 135-26 21m107-21 26 21M136 141h46" stroke-dasharray="4 7"/><circle cx="111" cy="193" r="16"/><circle cx="208" cy="193" r="16"/></g><g stroke="#658eb5" stroke-width="1" stroke-dasharray="4 7"><path d="M49 30h225M49 207h225M51 22v191M270 22v191"/><circle cx="160" cy="124" r="88"/></g><circle cx="160" cy="40" r="5" fill="#d6f1ff"/></svg><div class="robot-foot">BUILD → CODE → DEBUG → REPEAT</div></div>`;
      default:return '';
    }
  }
  function projectCard(p,t,index,total){const d=p[lang];return `<article class="project-card project-${p.art}">
    <div class="project-index">${String(index+1).padStart(2,'0')}<span> / ${String(total).padStart(2,'0')}</span></div>
    <div class="project-body">
      <div class="project-category"><span>${safe(d.category)}</span><span class="project-marker">✳︎</span></div>
      <div class="project-title-row"><h3>${safe(d.title)}</h3><span class="project-role">${safe(d.role)}</span></div>
      <p class="project-description">${safe(d.description)}</p>
      <p class="project-note">${safe(d.note)}</p>
      <div class="project-bottom"><div class="project-tags">${d.tags.map(tag=>`<span>${safe(tag)}</span>`).join('')}</div><div class="project-actions">${p.link?`<a class="simple-link project-live" href="${p.link}" target="_blank" rel="noopener noreferrer">${safe(t.visit)} ${icons.out}</a>`:''}<button class="simple-link" type="button" data-project="${p.id}">${safe(t.detail)} ${icons.arrow}</button></div></div>
    </div></article>`}
  /* Preserve award categories only as tags; chronology now controls the presentation.
     No invented dates: calendar year is the available precision. For a range such as
     2025–2026 we sort by its most recent year. Ties use medal/prize rank first. */
  const awardCategories={
    algorithms:{en:'Programming',zh:'算法竞赛'},
    math:{en:'Mathematics',zh:'数学竞赛'},
    robotics:{en:'Robotics',zh:'机器人'},
    products:{en:'Innovation',zh:'创新创业'},
    participation:{en:'Tech Activity',zh:'技术活动'}
  };
  function awardRank(item,key){
    if(key==='participation')return 0;
    const en=(item.enResult||'').toLowerCase();
    if(en.includes('first prize')||en.includes('gold medal'))return 60;
    if(en.includes('silver medal'))return 55;
    if(en.includes('second prize'))return 50;
    if(en.includes('bronze medal'))return 45;
    if(en.includes('top 5%'))return 43;
    if(en.includes('third place')||en.includes('3rd place'))return 40;
    if(en.includes('third prize'))return 35;
    if(en.includes('selection')||en.includes('finalist'))return 20;
    return 10;
  }
  function awardTimeline(){
    const result=[];let seq=0;
    for(const [key,rows] of Object.entries(SITE.awards)){
      for(const item of rows){
        const years=String(item.year).match(/20\d\d/g)||[];
        const latest=Math.max(0,...years.map(Number));
        result.push({key,item,seq:seq++,latest,rank:awardRank(item,key)});
      }
    }
    // Optional featuredPosition (1, 2, 3...) is only used WITHIN a year.
    // Edit or remove it in source/content.js whenever the preferred order changes.
    return result.sort((a,b)=>b.latest-a.latest
      || (a.item.featuredPosition??999)-(b.item.featuredPosition??999)
      || b.rank-a.rank || a.seq-b.seq);
  }
  /* Medal emojis for prizes; certificate emoji for top-5% and second-round selection.
     Participation stays text-only. Champion is reserved for the entrepreneurship camp. */
  function awardEmoji(item,key){
    if(key==='participation')return '';
    const r=(item.enResult||'').toLowerCase();
    if(r.includes('champion'))return '🏆';
    if(r.includes('gold medal')||r.includes('first prize'))return '🥇';
    if(r.includes('silver medal')||r.includes('second prize'))return '🥈';
    if(r.includes('bronze medal')||r.includes('third prize')||r.includes('third place')||r.includes('3rd place'))return '🥉';
    if(r.includes('top 5%')||r.includes('second-round selection'))return '📜';
    return '';
  }
  function awardTimelineMarkup(){return awardTimeline().map(({key,item})=>{
    const category=item.en.startsWith('CSP-S')?(lang==='zh'?'能力认证':'Certification'):awardCategories[key][lang];
    const result=key==='participation'?(lang==='zh'?'参与':'Participated'):(lang==='zh'?item.zhResult:item.enResult);
    const emoji=awardEmoji(item,key);
    const participation=key==='participation';
    return `<div class="award-row" data-category="${key}" data-year="${safe(item.year)}">
      <span class="award-year">${safe(item.year)}</span>
      <div class="award-details"><span class="award-name">${safe(item[lang])}</span><span class="award-category">${safe(category)}</span><span class="award-result ${participation?'award-participated':'award-distinction'}"><span class="award-dash">—</span> <strong>${safe(result)}</strong>${emoji?` <span class="award-emoji" aria-hidden="true">${emoji}</span>`:''}</span></div>
    </div>`;
  }).join('')}
  function lifeCard(key, title,subtitle,t,mark){const photo=SITE.lifePhotos[key];const hasPhoto=/^[\w./-]+\.(jpg|jpeg|png|webp)$/i.test(photo||'') && !photo.includes('..');return `<article class="life-card life-${key}"><div class="life-art ${hasPhoto?'has-photo':''}">${hasPhoto?`<img src="${escapeHTML(photo)}" alt="${safe(title)}" loading="lazy">`:`<span class="life-num">${mark}</span><span class="life-symbol">${key==='basketball'?'◉':key==='drums'?'♫':'✳︎'}</span><span class="life-placeholder">${safe(t.photoPlaceholder)}</span>`}</div><div class="life-card-footer"><div><h3>${safe(title)}</h3><p>${safe(subtitle)}</p></div><span>↗︎</span></div></article>`}
  function mapMarkup(t){const countries=SITE.travelCountries;
    return `<div class="atlas-card"><div class="atlas-text"><div class="atlas-label">✳︎ ${safe(t.mapEyebrow)}</div><h3>${safe(t.mapTitle)}</h3><p>${safe(t.mapDesc)}</p><div class="atlas-country-list">${countries.length?`<span>${safe(t.mapVisited)}:</span> ${countries.map(v=>`<b>${safe(v)}</b>`).join('')}`:`<span class="atlas-empty">${safe(t.mapEmpty)} ↗︎</span>`}</div></div><div class="atlas-art"><div class="atlas-globe"><span class="world-motif" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 9V91M9 50H91M21 21L79 79M79 21L21 79" stroke="currentColor" stroke-width="9" stroke-linecap="round"/></svg></span><div class="world-lat lat1"></div><div class="world-lat lat2"></div><div class="world-meridian mer1"></div><div class="world-meridian mer2"></div></div><span class="atlas-coordinate">EXPLORING / 00° 00′</span></div></div>`;
  }
  function blogNoteArt(id){
    if(id==='network-flow')return `<svg viewBox="0 0 440 120" fill="none"><g stroke="#8bbce0" stroke-width="2"><path d="M69 60L165 29L275 29L371 60M69 60L165 91L275 91L371 60M165 29L275 91"/><path d="m113 40 9 2-6 7m96-24 7 4-7 4m107 6 6 7-9 1m-99 39 7 4-7 4m110-23 9 1-6 7" stroke-linecap="round" stroke-linejoin="round"/></g><g fill="#c6e5fa" stroke="#6fa9d5" stroke-width="2"><circle cx="69" cy="60" r="15"/><circle cx="165" cy="29" r="12"/><circle cx="165" cy="91" r="12"/><circle cx="275" cy="29" r="12"/><circle cx="275" cy="91" r="12"/><circle cx="371" cy="60" r="15"/></g><g fill="#397bac" font-size="10" font-family="monospace" text-anchor="middle"><text x="69" y="64">S</text><text x="371" y="64">T</text></g></svg>`;
    return `<svg viewBox="0 0 440 120" fill="none"><g stroke="#96bfdd" stroke-width="1.5"><rect x="35" y="35" width="110" height="42" rx="5" fill="#d5ebfb"/><rect x="165" y="35" width="110" height="42" rx="5" fill="#b7daf4"/><rect x="295" y="35" width="110" height="42" rx="5" fill="#d5ebfb"/><path d="M62 36v40m28-40v40m28-40v40m74-40v40m28-40v40m28-40v40m74-40v40m28-40v40m28-40v40" stroke="#f5fbff"/><path d="M35 87v7h110v-7m20 0v7h110v-7m20 0v7h110v-7" stroke-linecap="round"/></g><path d="M74 24h278" stroke="#70a9d5" stroke-width="2" stroke-dasharray="4 7"/><g fill="#6a9bba" font-size="8" font-family="monospace" text-anchor="middle"><text x="90" y="110">01 / BLOCK</text><text x="220" y="110">02 / BLOCK</text><text x="350" y="110">03 / BLOCK</text></g></svg>`;
  }
  function blogNotesMarkup(t){return SITE.blogNotes.map(note=>{const d=note[lang];return `<article class="blog-feature blog-note" data-blog-note="${note.id}"><div class="blog-feature-art" aria-hidden="true">${blogNoteArt(note.id)}</div><div class="blog-feature-content"><div class="blog-feature-label"><span>✳︎</span> ${safe(d.label)}</div><h3>${safe(d.title)}</h3>${d.original?`<div class="blog-original">${safe(d.original)}</div>`:''}<p>${safe(d.description)}</p><div class="blog-feature-foot"><span>${safe(d.remark)}</span><a href="${note.url}" target="_blank" rel="noopener noreferrer" aria-label="${safe(t.read)}: ${safe(d.title)}">${safe(t.read)} ↗︎</a></div></div></article>`}).join('')}
  const sectionTitle=(section)=>(section.titleLines||[section.title]).map(safe).join('<br>');
  function render(){const t=SITE.languages[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=lang==='zh'?'王籽阳 · William Wang — 个人主页':'William Wang · 王籽阳 — Personal Website';
  $('#app').innerHTML=`<div id="top"></div><header class="site-header"><div class="wrap header-layout"><a href="#top" class="brand"><span class="brand-icon">W<span>.</span></span><span class="brand-name">WILLIAM WANG <i>/ 王籽阳</i></span></a><nav class="main-nav ${menuOpen?'open':''}" aria-label="Main navigation">${navItems.map(k=>`<a href="#${k}" data-nav="${k}">${safe(t.nav[k])}</a>`).join('')}</nav><div class="header-actions"><button class="language-toggle" type="button" id="lang-toggle" aria-label="${lang==='zh'?'Switch to English':'切换中文'}">${icons.globe}<span>${lang==='zh'?'EN':'中文'}</span></button><a class="header-email" href="mailto:${SITE.email}" aria-label="Email William">${icons.out}</a><button class="menu-button" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="${menuOpen}">${icons.menu}</button></div></div></header>
  <main>
    <section class="hero wrap" id="home"><div class="hero-copy"><div class="hero-overline"><span></span>${safe(t.hero.tiny)}</div><div class="hero-hello"><span class="mini-star">✳︎</span>${safe(t.hero.hello)}<span class="blue-stop">.</span></div><h1>${safe(t.hero.line1)}<br><em>${safe(t.hero.line2)}</em></h1><p class="hero-intro">${safe(t.hero.intro)}</p><div class="hero-buttons"><a href="#projects" class="btn btn-dark">${safe(t.hero.projects)} ${icons.out}</a><a href="#about" class="btn btn-outline">${safe(t.hero.about)} ${icons.arrow}</a></div><div class="hero-location"><span class="location-pin">⌖</span>${safe(t.hero.location)}</div></div><div class="hero-visual"><div class="hero-graphic">${globeArt}</div><div class="hero-handnote"><span>✳︎</span>${safe(t.hero.scribble)}<svg viewBox="0 0 58 26"><path d="M3 19C15 23 29 1 54 8M45 3l9 5-5 9"/></svg></div></div><a class="scroll-cue" href="#about">${safe(t.hero.scroll)} ${icons.down}</a></section>
    <div class="ticker"><div>OPEN QUESTIONS <span>✳︎</span> GOOD IDEAS <span>✳︎</span> MAKING THINGS <span>✳︎</span> OPEN QUESTIONS <span>✳︎</span> GOOD IDEAS <span>✳︎</span> MAKING THINGS <span>✳︎</span></div></div>
    <section class="about section" id="about"><div class="wrap about-grid"><div>${eyebrow(t.about.eyebrow)}<h2 class="section-title">${safe(t.about.title1)}<br><em>${safe(t.about.title2)}</em></h2><div class="about-paragraphs">${t.about.paragraphs.map(x=>`<p>${safe(x)}</p>`).join('')}</div><div class="tag-cloud">${t.about.tags.map(x=>`<span>${safe(x)}</span>`).join('')}</div></div><div class="about-aside"><div class="education-card"><img class="education-emblem" src="assets/images/sjtu-emblem.png" alt="${lang==='zh'?'上海交通大学校徽':'Shanghai Jiao Tong University emblem'}" width="2047" height="2048" loading="lazy" decoding="async"><div class="education-caption">EDUCATION / 2026</div><h3>${safe(t.about.school)}</h3><p>${safe(t.about.schoolSub)}</p><div class="education-prior">${safe(t.about.before)}</div><div class="education-brand">SJTU <span>↗︎</span></div></div><div class="quote-card"><span>${safe(t.about.mottoLabel)}</span><p>“${safe(t.about.motto)}”</p><div>∿∿∿∿∿</div></div></div></div></section>
    <section class="projects section" id="projects"><div class="wrap"><div class="section-header"><div>${eyebrow(t.projects.eyebrow)}<h2 class="section-title">${safe(t.projects.title)}<span class="title-dot">.</span></h2></div><p>${safe(t.projects.desc)}</p></div><div class="project-grid">${['fbti','hbti','nbati','summary','star','robocup'].map(id=>SITE.projectData.find(p=>p.id===id)).filter(Boolean).map((p,i,arr)=>projectCard(p,t.projects,i,arr.length)).join('')}</div></div></section>
    <section class="competitions section" id="competitions"><div class="wrap"><div class="section-header compact"><div>${eyebrow(t.competitions.eyebrow)}<h2 class="section-title">${sectionTitle(t.competitions)}<span class="title-dot">.</span></h2></div>${t.competitions.desc?`<p>${safe(t.competitions.desc)}</p>`:''}</div><div class="awards-grid timeline-list">${awardTimelineMarkup()}</div><p class="awards-footnote">✳︎ ${safe(t.competitions.foot)}</p></div></section>
    <section class="experience section" id="experience"><div class="wrap experience-layout"><div class="experience-lead">${eyebrow(t.experience.eyebrow)}<h2 class="section-title">${sectionTitle(t.experience)}<span class="title-dot">.</span></h2><p>${safe(t.experience.desc)}</p><div class="experience-sketch">∿<span>↗︎</span></div></div><div class="experience-list">${t.experience.items.map((x,i)=>`<article class="experience-item"><div class="experience-number">0${i+1} / WORK</div><h3>${safe(x.title)}</h3><strong>${safe(x.role)}</strong><p>${safe(x.desc)}</p><div class="experience-tag">${safe(x.tag)} ${icons.out}</div></article>`).join('')}</div></div></section>
    <section class="research section" id="research"><div class="wrap research-grid"><div class="research-lead">${eyebrow(t.research.eyebrow,true)}<h2 class="section-title">${safe(t.research.title1)}<br><em>${safe(t.research.title2)}</em></h2><p>${safe(t.research.desc)}</p><div class="research-orbit">✳︎</div></div><div class="research-list">${t.research.items.map(x=>`<article class="research-topic"><div class="research-top"><span>${safe(x.no)} / FOCUS</span><span>↗︎</span></div><h3>${safe(x.title)}</h3><p>${safe(x.desc)}</p></article>`).join('')}<div class="research-disclaimer">✳︎ ${safe(t.research.note)}</div></div></div></section>
    <section class="blog section" id="blog"><div class="wrap blog-layout"><div class="blog-intro">${eyebrow(t.blog.eyebrow)}<h2 class="section-title">${sectionTitle(t.blog)}<span class="title-dot">.</span></h2><p class="blog-desc">${safe(t.blog.desc)}</p><a class="blog-cta" href="${SITE.blogUrl}" target="_blank" rel="noopener noreferrer">${safe(t.blog.blogAction)} <span aria-hidden="true">↗︎</span></a></div><div class="blog-notes"><article class="blog-feature blog-note"><div class="blog-feature-art" aria-hidden="true"><svg viewBox="0 0 440 155" fill="none"><path d="M26 113L108 36L203 94L298 27L402 92" stroke="#7cbae8" stroke-width="2" stroke-dasharray="8 10"/><path d="M108 36L298 27M203 94L402 92" stroke="#a9cee9" stroke-width="1.5" opacity=".8"/><circle cx="26" cy="113" r="10" fill="#d4eafa" stroke="#70a9d9" stroke-width="2"/><circle cx="108" cy="36" r="13" fill="#a7d4f3" stroke="#5d9ccc" stroke-width="2"/><circle cx="203" cy="94" r="12" fill="#ebf7ff" stroke="#70a9d9" stroke-width="2"/><circle cx="298" cy="27" r="15" fill="#bcdff8" stroke="#5d9ccc" stroke-width="2"/><circle cx="402" cy="92" r="10" fill="#d4eafa" stroke="#70a9d9" stroke-width="2"/><text x="108" y="17" fill="#397bac" font-size="9" font-family="monospace" text-anchor="middle">DFS</text><text x="298" y="60" fill="#397bac" font-size="9" font-family="monospace" text-anchor="middle">LOW</text></svg></div><div class="blog-feature-content"><div class="blog-feature-label"><span>✳︎</span> ${safe(t.blog.featuredLabel)}</div><h3>${safe(t.blog.featuredTitle)}</h3>${t.blog.featuredOriginal?`<div class="blog-original">${safe(t.blog.featuredOriginal)}</div>`:''}<p>${safe(t.blog.featuredDesc)}</p><div class="blog-feature-foot"><span>${safe(t.blog.remark)}</span><a href="${SITE.featuredArticleUrl}" target="_blank" rel="noopener noreferrer">${safe(t.blog.read)} ↗︎</a></div></div></article>${blogNotesMarkup(t.blog)}</div></div></section>
    <section class="life section" id="life"><div class="wrap"><div class="life-layout"><div class="life-copy">${eyebrow(t.life.eyebrow)}<div class="life-header"><h2 class="section-title">${sectionTitle(t.life)}</h2><div class="life-intro">${t.life.paragraphs.map(paragraph=>`<p>${safe(paragraph)}</p>`).join('')}</div></div></div><div class="life-cards">${lifeCard('basketball',t.life.basketball,t.life.basketballSub,t.life,'01')}${lifeCard('drums',t.life.drums,t.life.drumsSub,t.life,'02')}${lifeCard('travel',t.life.travel,t.life.travelSub,t.life,'03')}</div></div>${mapMarkup(t.life)}<div class="life-quote">“${safe(t.life.quote)}” <span>✳︎</span></div></div></section>
    <section class="contact section" id="contact"><div class="wrap contact-grid"><div>${eyebrow(t.contact.eyebrow,true)}<h2>${safe(t.contact.title1)}<br><em>${safe(t.contact.title2)}</em></h2><p>${safe(t.contact.desc)}</p><div class="contact-buttons"><a class="btn btn-accent" href="mailto:${SITE.email}">${safe(t.contact.write)} ${icons.out}</a><button class="btn btn-glass" type="button" id="copy-email">${safe(t.contact.copy)} ${icons.copy}</button></div></div><div class="contact-side"><div class="contact-flower">✳︎</div><a href="mailto:${SITE.email}">${SITE.email} ${icons.out}</a><span>CONNECT / COLLABORATE / CREATE</span></div></div></section>
  </main><footer class="footer"><div class="wrap footer-content"><a href="#top" class="footer-logo">W<span>.</span></a><span>© 2026 William Wang · ${safe(t.contact.footer)}</span><a href="#top">${safe(t.contact.back)} ↑</a></div></footer><div id="modal-mount"></div>`;
    wire(); if(openId)openProject(openId);
  }
  function wire(){ $('#lang-toggle').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('william-lang-v3',lang)}catch{}menuOpen=false;render()});
    $('#menu-toggle').addEventListener('click',()=>{menuOpen=!menuOpen;$('.main-nav').classList.toggle('open',menuOpen);$('#menu-toggle').setAttribute('aria-expanded',String(menuOpen))});
    document.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener('click',()=>{menuOpen=false;$('.main-nav').classList.remove('open')}));
    document.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>openProject(b.dataset.project)));
    $('#copy-email').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(SITE.email);const b=$('#copy-email');b.innerHTML=`${safe(SITE.languages[lang].contact.copied)} ✓`;setTimeout(()=>{const live=$('#copy-email');if(live)live.innerHTML=`${safe(SITE.languages[lang].contact.copy)} ${icons.copy}`},1900)}catch{window.location.href='mailto:'+SITE.email}});
  }
  function openProject(id){const p=SITE.projectData.find(v=>v.id===id);if(!p)return;openId=id;const t=SITE.languages[lang].projects,d=p[lang];const node=$('#modal-mount');node.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-project-title"><button type="button" class="modal-close" aria-label="${safe(t.close)}">${icons.close}</button><div class="modal-graphic">${art(p)}</div><div class="modal-body"><div class="modal-caption">${safe(d.category)}</div><h2 id="modal-project-title">${safe(d.title)}</h2><p class="modal-intro">${safe(d.intro)}</p><div class="modal-detail"><div><label>${safe(t.role)}</label><p>${safe(d.role)}</p></div><div><label>${safe(t.what)}</label><p>${safe(d.description)}</p></div><div><label>${safe(t.more)}</label><p>${safe(d.note)}</p></div></div><div class="modal-actions"><div class="project-tags">${d.tags.map(tag=>`<span>${safe(tag)}</span>`).join('')}</div>${p.link?`<a class="btn btn-dark" target="_blank" rel="noopener noreferrer" href="${p.link}">${safe(t.visit)} ${icons.out}</a>`:`<span class="no-public-link">${safe(t.noLink)}</span>`}</div></div></div></div>`;document.body.classList.add('modal-open');$('.modal-close').focus();$('.modal-close').addEventListener('click',closeModal);$('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});}
  function closeModal(){openId=null;document.body.classList.remove('modal-open');const node=$('#modal-mount');if(node)node.innerHTML='';}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closeModal()});
  render();
})();

</script>
